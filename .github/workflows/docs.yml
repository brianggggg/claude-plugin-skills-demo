name: Docs

on:
  push:
    branches:
      - main
  # Fired by TestGhostProject's own Docs workflow after it deploys, so a
  # push there refreshes this site's cross-repo numbers too. See
  # docs/guides/faq.md and scripts/generate_repo_summary.py
  # (build_cross_repo_test). Requires a CROSS_REPO_DISPATCH_TOKEN secret
  # on TestGhostProject's side — see that repo's docs.yml for the other
  # half of this.
  repository_dispatch:
    types: [testghostproject-updated]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout TestGhostProject (cross-repo test — see FAQ)
        uses: actions/checkout@v4
        with:
          repository: brianggggg/TestGhostProject
          path: TestGhostProject

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Configure git identity for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate repo summary page
        env:
          OTHER_REPO_ROOT: ${{ github.workspace }}/TestGhostProject
        run: python scripts/generate_repo_summary.py

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean
