version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Regenerate the plugin/skill catalog from the repo's current state
      # before MkDocs builds the site, so Read the Docs always publishes
      # a catalog that matches the latest push.
      - python scripts/generate_repo_summary.py

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: requirements.txt
