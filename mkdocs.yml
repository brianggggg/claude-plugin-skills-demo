site_name: Claude COE
site_description: Home for the team's Claude skills and teams — what they do, how to use them, and how to publish your own.
repo_url: https://github.com/brianggggg/claude-plugin-skills-demo
repo_name: brianggggg/claude-plugin-skills-demo

nav:
  - Home: index.md
  - CitDev Resources:
      - guides/index.md
      - Getting started: guides/getting-started.md
      - Publishing a skill: guides/publishing-a-skill.md
      - Registering a team: guides/publishing-a-plugin.md
      - Requesting a connector: guides/requesting-a-connector.md
      - Report an issue: guides/report-an-issue.md
      - FAQ: guides/faq.md
  - CitDev Inventory: plugins/index.md
  - Important links: important-links.md
  - Reporting: activity.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

validation:
  omitted_files: ignore

extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/home.js

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - docs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
